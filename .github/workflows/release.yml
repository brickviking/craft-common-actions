name: "Release"

on:
  workflow_call:
    inputs:
      app-name:
        description: "Application repository name (e.g. photocraft, cadcraft)"
        type: string
        required: true
      app-title:
        description: "Application display name (e.g. PhotoCraft, CADCraft)"
        type: string
        required: true
      craft-fonts-ref:
        description: "Git ref for storytold/craft-fonts embedded font assets (optional)"
        type: string
        required: false
        default: ""
      web-craft-fonts:
        description: "Build the web release with craft-fonts too (CRAFT_FONTS_DIR); needs craft-fonts-ref. Off by default: each app's build.rs picks which fonts its web build embeds"
        type: boolean
        required: false
        default: false
      version:
        description: "Version override for a test run (empty: read from Cargo.toml)"
        type: string
        required: false
        default: ""
      has-web:
        description: "Whether to build the WebAssembly (wasm) release"
        type: boolean
        required: false
        default: true
      has-riscv64:
        description: "Whether to build the Linux riscv64 release"
        type: boolean
        required: false
        default: false
      has-freebsd:
        description: "Whether to build the FreeBSD release"
        type: boolean
        required: false
        default: false
      wix-version:
        description: "Version of WiX tool to install"
        type: string
        required: false
        default: "5.0.2"
      nfpm-version:
        description: "Version of nfpm tool to install"
        type: string
        required: false
        default: "2.47.0"
      trunk-version:
        description: "Version of trunk tool to install"
        type: string
        required: false
        default: "0.21.14"
      freebsd-release:
        description: "FreeBSD OS version to run in VM"
        type: string
        required: false
        default: false
      has-server:
        description: "Whether to build and release the headless Linux server"
        type: boolean
        required: false
        default: false

    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ENDPOINT:
        required: false
      AZURE_SIGNING_ACCOUNT:
        required: false
      AZURE_CERT_PROFILE:
        required: false

permissions:
  contents: write

jobs:
  version:
    timeout-minutes: 10
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Resolve version
        uses: storytold/craft-common-actions/actions/resolve-version@main
        with:
          input-version: ${{ inputs.version }}
          app-title: ${{ inputs.app-title }}

  linux:
    timeout-minutes: 90
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      CADCRAFT_VERSION: ${{ needs.version.outputs.version }}
      CADCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      CADCRAFT_BUILD_SHA: ${{ github.sha }}
      ARTCRAFT_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      ARTCRAFT_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      ARTCRAFT_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      DECKCRAFT_VERSION: ${{ needs.version.outputs.version }}
      DECKCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      DECKCRAFT_BUILD_SHA: ${{ github.sha }}
      DESIGNCRAFT_VERSION: ${{ needs.version.outputs.version }}
      DESIGNCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      DESIGNCRAFT_BUILD_SHA: ${{ github.sha }}
      EFFECTCRAFT_VERSION: ${{ needs.version.outputs.version }}
      EFFECTCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      EFFECTCRAFT_BUILD_SHA: ${{ github.sha }}
      FILMCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FILMCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
      GRIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      GRIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      GRIDCRAFT_BUILD_SHA: ${{ github.sha }}
      LIGHTCRAFT_VERSION: ${{ needs.version.outputs.version }}
      LIGHTCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      LIGHTCRAFT_BUILD_SHA: ${{ github.sha }}
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PHOTOCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
      SOUNDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOUNDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      SOUNDCRAFT_BUILD_SHA: ${{ github.sha }}
      VECTORCRAFT_VERSION: ${{ needs.version.outputs.version }}
      VECTORCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      VECTORCRAFT_BUILD_SHA: ${{ github.sha }}
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ github.sha }}
      FIGCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FIGCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FIGCRAFT_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        if: inputs.craft-fonts-ref != ''
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - uses: storytold/craft-common-actions/actions/install-linux-deps@main
        with:
          deb-arch: ${{ matrix.deb }}
          nfpm-version: ${{ inputs.nfpm-version }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb || true
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/|metainfo|applications' || true
          for appimage in dist/release/*.AppImage; do
            if [ -f "$appimage" ]; then
              chmod +x "$appimage"
              APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version || true
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  web:
    timeout-minutes: 90
    name: Web (wasm)
    if: inputs.has-web
    needs: version
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      CADCRAFT_VERSION: ${{ needs.version.outputs.version }}
      CADCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      CADCRAFT_BUILD_SHA: ${{ github.sha }}
      ARTCRAFT_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      ARTCRAFT_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      ARTCRAFT_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      DECKCRAFT_VERSION: ${{ needs.version.outputs.version }}
      DECKCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      DECKCRAFT_BUILD_SHA: ${{ github.sha }}
      DESIGNCRAFT_VERSION: ${{ needs.version.outputs.version }}
      DESIGNCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      DESIGNCRAFT_BUILD_SHA: ${{ github.sha }}
      EFFECTCRAFT_VERSION: ${{ needs.version.outputs.version }}
      EFFECTCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      EFFECTCRAFT_BUILD_SHA: ${{ github.sha }}
      FILMCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FILMCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
      GRIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      GRIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      GRIDCRAFT_BUILD_SHA: ${{ github.sha }}
      LIGHTCRAFT_VERSION: ${{ needs.version.outputs.version }}
      LIGHTCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      LIGHTCRAFT_BUILD_SHA: ${{ github.sha }}
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PHOTOCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
      SOUNDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOUNDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      SOUNDCRAFT_BUILD_SHA: ${{ github.sha }}
      VECTORCRAFT_VERSION: ${{ needs.version.outputs.version }}
      VECTORCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      VECTORCRAFT_BUILD_SHA: ${{ github.sha }}
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ github.sha }}
      FIGCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FIGCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FIGCRAFT_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-web
      - uses: storytold/craft-common-actions/actions/install-trunk@main
        with:
          trunk-version: ${{ inputs.trunk-version }}
      - name: Check out craft-fonts
        if: inputs.web-craft-fonts && inputs.craft-fonts-ref != ''
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION"
      - name: Build and zip
        if: ${{ !(inputs.web-craft-fonts && inputs.craft-fonts-ref != '') }}
        run: packaging/web/package.sh
      - name: Build and zip (with craft-fonts)
        if: inputs.web-craft-fonts && inputs.craft-fonts-ref != ''
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/web/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/release/*
          if-no-files-found: error

  server:
    timeout-minutes: 90
    name: Server Linux ${{ matrix.arch }}
    if: inputs.has-server
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      FIGCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FIGCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FIGCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-server-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION" || cargo run --locked -q -p xtask -- version set "$VERSION" || true
      - name: Build and package (tar.gz)
        run: packaging/server/package.sh
      - name: Check the archive
        shell: bash
        run: |
          tar -tzf "dist/release/${{ inputs.app-name }}-server-$VERSION-linux-${{ matrix.arch }}.tar.gz" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server-linux-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  release:
    timeout-minutes: 10
    name: Draft GitHub Release
    if: "!cancelled() && !contains(needs.*.result, 'failure')"
    needs: [version, linux, web, server]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: brickviking/craft-common-actions/actions/draft-release@main
        with:
          version: ${{ needs.version.outputs.version }}
          app-title: ${{ inputs.app-title }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
